services:
  postgres:
    image: postgres:16-alpine
    container_name: excave-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: excave
      POSTGRES_PASSWORD: excave
      POSTGRES_DB: excave
    volumes:
      - excave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excave -d excave"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  excave_pgdata:
